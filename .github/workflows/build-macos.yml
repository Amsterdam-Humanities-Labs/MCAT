name: Build macOS App

on:
  push:
    branches: [build]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install pnpm
      run: npm install -g pnpm@9

    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile

    - name: Build frontend
      run: pnpm --filter frontend build

    - name: Set up Python venv and install dependencies
      run: |
        cd backend
        python -m venv venv
        venv/bin/pip install --upgrade pip
        venv/bin/pip install pywebview polars selenium chromedriver-autoinstaller pydispatcher pyinstaller pyobjc-framework-WebKit

    - name: Build with PyInstaller
      run: |
        cd backend
        venv/bin/python -m PyInstaller --clean mcat.spec

    - name: Zip the app bundle
      run: |
        cd backend/dist
        zip -r MCAT-macOS.zip MCAT.app

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: MCAT-macOS
        path: backend/dist/MCAT-macOS.zip
