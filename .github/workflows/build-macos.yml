name: Build macOS App

on:
  push:
    branches: [build]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon build -> ships to the researcher. Built on Tahoe
          # (macos-26) to match their OS exactly.
          - runner: macos-26
            arch: arm64
          # Intel build -> for the local QEMU Sequoia VM (x86_64). Built on
          # Intel Sequoia (macos-15-intel) to match that VM exactly.
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    name: build-${{ matrix.arch }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install pnpm
      run: npm install -g pnpm@9

    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile

    - name: Build frontend
      run: pnpm --filter frontend build

    - name: Set up Python venv and install dependencies
      run: |
        cd packages/app/backend
        python -m venv venv
        venv/bin/pip install --upgrade pip
        venv/bin/pip install ".[dev]"

    - name: Build with PyInstaller
      run: |
        cd packages/app/backend
        venv/bin/python -m PyInstaller --clean mcat.spec

    - name: Verify bundle architecture
      run: |
        cd packages/app/backend/dist
        file MCAT.app/Contents/MacOS/mcat

    - name: Zip the app bundle
      run: |
        cd packages/app/backend/dist
        zip -r MCAT-macOS-${{ matrix.arch }}.zip MCAT.app

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: MCAT-macOS-${{ matrix.arch }}
        path: packages/app/backend/dist/MCAT-macOS-${{ matrix.arch }}.zip
