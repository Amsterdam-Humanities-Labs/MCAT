name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend (with dev/test deps)
        run: pip install "./packages/app/backend[dev]"
      - name: Run tests
        run: python -m pytest
