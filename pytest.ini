[pytest]
# Pytest configuration for MCAT

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Add src to Python path for imports
pythonpath = src

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multi-component)
    slow: Slow running tests (Selenium, network calls)

# Ignore patterns
norecursedirs = .git .tox dist build *.egg env venv

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */env/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
skip_empty = True
