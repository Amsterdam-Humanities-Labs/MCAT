[project]
name = "mcat"
version = "0.1.0"
description = "MCAT - Moderation Content Analysis Tool"
requires-python = ">=3.10"
dependencies = [
    "zendriver>=0.15.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
    "pyright>=1.1.0",
]

[tool.pyright]
pythonVersion = "3.10"
reportMissingImports = "warning"
